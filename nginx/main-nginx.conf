events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=media:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=frontend:10m rate=30r/s;
    
    # Upstream services
    upstream backend {
        server backend:3001;
    }
    
    upstream frontend {
        server frontend:80;
    }
    
    # Main server block
    server {
        listen 80;
        server_name localhost;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Client max body size for file uploads
        client_max_body_size 100M;
        
        # Proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        
        # API routes to backend with rate limiting
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }
        
        # Health check (no rate limiting)
        location /health {
            proxy_pass http://backend;
            access_log off;
        }
        
        # WebSocket support for Socket.IO
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
        
        # Media files with caching and rate limiting
        location /media/ {
            limit_req zone=media burst=100 nodelay;
            alias /var/www/media/;
            expires 1d;
            add_header Cache-Control "public, immutable";
            
            # Security for media files
            location ~* \.(php|jsp|cgi|asp|aspx)$ {
                deny all;
            }
            
            # Video streaming support
            location ~* \.(mp4|webm|ogg|avi|mov)$ {
                add_header Accept-Ranges bytes;
                expires 7d;
            }
            
            # Image optimization
            location ~* \.(jpg|jpeg|png|gif|webp)$ {
                expires 30d;
                add_header Vary Accept-Encoding;
            }
        }
        
        # RSS feeds with caching
        location /rss/ {
            alias /var/www/rss/;
            expires 5m;
            add_header Cache-Control "public, must-revalidate";
            
            # XML files
            location ~* \.xml$ {
                add_header Content-Type "application/rss+xml; charset=UTF-8";
                expires 5m;
            }
        }
        
        # Frontend application (React)
        location / {
            limit_req zone=frontend burst=50 nodelay;
            proxy_pass http://frontend;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
            
            # Handle React Router
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }
        
        # Fallback for React Router
        location @fallback {
            proxy_pass http://frontend;
        }
        
        # Error pages
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
    
    # HTTPS server (uncomment and configure SSL certificates for production)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #     
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     
    #     # Include all the location blocks from the HTTP server above
    # }
}